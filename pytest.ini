[pytest]
# --import-mode=importlib is LOAD-BEARING, not taste. Reviewer proofs are copied
# in UNCHANGED, filename included, into per-review directories, and a reviewer
# names its files test_finding_1.py, test_finding_2.py and so on. Most review
# directory names begin with a DIGIT, so such a directory can never be a Python
# package component however many __init__.py files it holds. Under pytest's
# default prepend mode two directories each holding a test_finding_1.py collide
# and the whole run dies in collection with "import file mismatch". Renaming the
# proof would fix the collision, but a renamed proof is not the proof the
# reviewer wrote.
addopts = --import-mode=importlib
# The repository root is on the import path however pytest is started (`pytest` or `python -m pytest`), so tests can
# import the `scripts` directory.
pythonpath = .
# Both proof trees are collected. A proof tree that is not in testpaths does not
# run, and a proof that does not run is a ledger row that means nothing. Note
# that pytest IGNORES testpaths whenever a positional path is given, so the
# canonical suite command passes NO path.
testpaths = tests
# An empty parameter set would make pytest skip a test with no skip in the source; it fails collection instead, so
# the no-skip policy holds for every way a test can be skipped (AT2 F1, B-077).
empty_parameter_set_mark = fail_at_collect
