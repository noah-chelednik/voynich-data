[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcat-data"
version = "1.0.0"
description = "Data processing infrastructure for the Voynich Computational Analysis Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Noah Chelednik"}
]
keywords = [
    "voynich",
    "manuscript",
    "transcription",
    "computational-humanities",
    "digital-humanities"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "types-requests",
    "types-PyYAML",
    "ipython>=8.0",
    "jupyter>=1.0",
    # building the package without isolation, as the suite does (review 494bb9ab finding 3)
    "setuptools>=70.1",
    "wheel",
    # the CommonMark parser the card tests read fenced examples with (review f66f47d9 finding 2)
    "markdown-it-py>=3.0",
]

[project.urls]
Homepage = "https://github.com/noah-chelednik/voynich-data"
Documentation = "https://github.com/noah-chelednik/voynich-data#readme"
Repository = "https://github.com/noah-chelednik/voynich-data.git"
Issues = "https://github.com/noah-chelednik/voynich-data/issues"

[project.scripts]
vcat-verify = "data_sources.verify_sources:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vcat*", "parsers*", "builders*", "validators*", "hf*", "data_sources", "schemas"]

# The source registry ships with the package, so an installed builder can import it (vcat.sources reads
# data_sources/sources.yaml beside the vcat package; review 494bb9ab finding 3). The cached files themselves do not ship.
[tool.setuptools.package-data]
# and the layer registry the metadata builder publishes and the validators check (review 7454c2f9 finding 2)
# and the canvases of Yale's IIIF manifest the page links are read from (roadmap item 2.4)
data_sources = ["sources.yaml", "layers.yaml", "iiif/*.json"]
# The schemas `validators.load_schema` reads (AV7 F6)
schemas = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
# never edited here, so the host's lint and format rules do not apply to them.
extend-exclude = [
    # Reviewer proofs, copied in unchanged from the reviewer's artifact (DECISIONS Q9, Q11).
    "tests/regressions",
    "tests/regressions",
    # Reviewer proofs an artifact places directly under tests/ (AD1 F3, F4; DECISIONS Q50).
    "tests/test_audit_*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"notebooks/*" = ["E402"]  # Allow imports not at top of file
"scripts/*" = ["E402", "B007", "B905", "E741"]

[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = '^/(tests/regressions/.*|tests/test_audit_[^/]*\.py)$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# pytest is configured in pytest.ini only (B-005, DECISIONS Q5).

[tool.coverage.run]
source = ["vcat", "parsers", "builders", "validators"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
