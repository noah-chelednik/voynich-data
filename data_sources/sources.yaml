# Where VCAT's own outputs stand (roadmap item 1.9): data VCAT derives is CC0-1.0 where every source it derives from is
# CC0-1.0; annotations VCAT writes itself are CC-BY-4.0; code is MIT (LICENSE). Each dataset card's license follows from
# these entries (tests/test_sources.py):
#   every source CC0-1.0, no VCAT annotations   -> cc0-1.0
#   every source CC0-1.0, with VCAT annotations -> cc-by-4.0 (the source-derived fields stay CC0-1.0, as the card says)
#   any source not under CC0-1.0                -> other (license_name: per-source)
outputs:
  code: MIT
  derived_data_when_sources_cc0: CC0-1.0
  vcat_annotations: CC-BY-4.0

datasets:
  - name: voynich-eva
    card: huggingface/voynich-eva
    sources: [ZL, IT, IT2a, CD, FG, GC, RF1b, VT, LSI]
    # Its default lines and words are ZL's text and functions of it; since item 2.9 every other layer is one of its
    # configurations too (the metadata, the mismatch index, the transliterations and their variant tables), so it holds
    # VCAT's annotations (DECISIONS Q86).
    vcat_annotations: true
  - name: voynich-manuscript-metadata
    card: huggingface/voynich-manuscript-metadata
    sources: [ZL]
    # The folios' section attribution, confidence and dispute flags are VCAT's annotations.
    vcat_annotations: true
  - name: voynich-transcription-mismatch
    card: huggingface/voynich-transcription-mismatch
    sources: [ZL, IT, CD, FG, GC]
    # The verdicts and similarity scores are VCAT's comparison of ZL and IT; CD, FG and GC give only whether each holds
    # the locus (sources_present), none of their text.
    vcat_annotations: true
  - name: voynich-transliterations
    card: huggingface/voynich-transliterations
    sources: [ZL, IT, IT2a, CD, FG, GC, RF1b, VT, LSI]
    # Every row of the per-source configs is a source's text as written, with its ids and locus type (item 2.3); the
    # variant tables' agreement, majority baseline and alignments are VCAT's comparison (item 2.7; review 3d607506
    # finding 1, DECISIONS Q84).
    vcat_annotations: true
