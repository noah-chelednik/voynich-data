# The sources VCAT builds from (roadmap items 1.9 and 2.3).
#
# `cached` lists every file in data_sources/cache/, one record each. The suite checks this file against the cache
# (tests/test_sources.py): every cached file has a record and every record a file; each `sha256` is the file's; each
# `upstream_version` is the file's own version (below); `data_sources/checksums_all.txt` agrees.
# `vcat-verify` (data_sources/verify_sources.py) checks the same and writes reports/source_verification.json.
# Every file was fetched from its `url` on 2026-10-17 (S12) and had the pinned SHA-256 there.
#
# Fields:
#   url               where the file is published upstream
#   url_fetched       true: scripts/fetch_sources.py downloads it from `url` when it is missing and checks this hash
#   upstream_version  the file's version: its header's version line, verbatim; or, when the header carries none
#                     (`version_from: listing`), the version voynich.nu's table of transliteration files gives for it,
#                     which its file name also carries
#   listed_at         the voynich.nu table that links the file: one of the tables `license_statement` covers
#   license           the license the upstream states for the file, an SPDX id
#   license_basis     where that statement comes from
#   license_verified  true once the statement has been read at its source and quoted in docs/SOURCES_LICENSE.md (S12)
#   redistributed     true: the file itself is committed in this repository (data_sources/cache/)

# The upstream's license statement, read at its source on 2026-10-17 (S12), and the tables of files it covers. It is
# quoted verbatim in docs/SOURCES_LICENSE.md (the three "here" are the links to the tables below).
license_statement:
  url: https://www.voynich.nu/roadmap.html
  section: Licences and copyright
  read: "2026-10-17"
  quote: >-
    "The transliterations of the Voynich MS text, as collected in tables here, here and here, have been collected from different sources and have always been in the public domain. More specifically, they are being made available at this web site in accordance with the Creative Commons CC0 licence"
  tables:
    - https://www.voynich.nu/transcr.html#links
    - https://www.voynich.nu/extra/legacy.html
    - https://www.voynich.nu/extra/sta.html#stalinks

